name: CI-CD DevSecOps

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/jubsju/techsecure-app

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Source - checkout
        uses: actions/checkout@v4

      - name: Build - Node e dependencias
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Teste automatizado
        run: npm test

      - name: Security Scan - npm audit (dependencias de producao)
        run: npm audit --omit=dev --audit-level=high | tee npm-audit.txt

      - name: Build da imagem Docker
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Security Scan - Trivy (imagem)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-report.txt

      - name: Mostrar relatorio do Trivy no log
        if: always()
        run: cat trivy-report.txt || true

      - name: Publicar relatorios de seguranca
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-seguranca
          path: |
            npm-audit.txt
            trivy-report.txt

      - name: Push da imagem (so se passou no scan)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    needs: build-test-scan
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy do container
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE:latest
          docker rm -f techsecure-app || true
          docker run -d --name techsecure-app -p 8080:3000 --restart unless-stopped $IMAGE:latest
          docker ps --filter name=techsecure-app
